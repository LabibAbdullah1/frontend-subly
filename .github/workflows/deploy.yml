name: Deploy Frontend to cPanel via FTP

on:
  push:
    branches:
      - linear-version
  workflow_dispatch:

# Hindari multiple deployment berjalan bersamaan
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Application (Vite + TypeScript)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api-be.subly.my.id/api' }}
        run: npm run build

      - name: 📂 Verify Build Output
        run: |
          ls -la dist/
          test -f dist/index.html || exit 1

      # Hanya file & folder hasil build di dalam ./dist/ yang dikirim,
      # dan diletakkan langsung di root direktori FTP cPanel (bukan di dalam subfolder dist).
      # Menggunakan LFTP native Linux untuk kompatibilitas penuh dengan Pure-FTPd cPanel
      # (bebas dari bug TLS Session Resumption Node.js yang menyebabkan ECONNRESET).
      - name: 🚀 Sync Files via LFTP to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --verbose --parallel=5 ./dist/ "$FTP_SERVER_DIR"
          bye
          EOF
