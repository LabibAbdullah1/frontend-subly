name: Deploy Frontend to cPanel via FTP

on:
  push:
    branches:
      - linear-version
  workflow_dispatch:

# Hindari multiple deployment berjalan bersamaan
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Application (Vite + TypeScript)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api-be.subly.my.id/api' }}
        run: npm run build

      - name: 📂 Verify Build Output
        run: |
          ls -la dist/
          test -f dist/index.html || exit 1

      # Hanya file & folder hasil build di dalam ./dist/ yang dikirim,
      # dan diletakkan langsung di root direktori FTP cPanel (bukan di dalam subfolder dist).
      - name: 🚀 Sync Files via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          timeout: 60000
          log-level: verbose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
